<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="A simple street map for finding places around Utah." />
    <title>YOUtah — Simple Map</title>
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.2.0/dist/maplibre-gl.css" />
    <link rel="stylesheet" href="/assets/simple-map.css" />
  </head>
  <body>
    <main class="map-app">
      <div id="simple-map" aria-label="Interactive street map of Utah" role="application"></div>

      <header class="map-header">
        <a class="brand" href="/" aria-label="YOUtah home"><span class="brand-mark">⌁</span><span>YOUtah</span></a>
        <form class="search" id="search-form" role="search">
          <label class="sr-only" for="place-search">Search Utah places</label>
          <span class="search-icon" aria-hidden="true">⌕</span>
          <input id="place-search" type="search" autocomplete="off" placeholder="Search Utah places" />
          <button class="clear-search" id="clear-search" type="button" aria-label="Clear search" hidden>×</button>
        </form>
        <nav class="view-switch" aria-label="Map view">
          <a class="active" href="/map/simple" aria-current="page">Simple</a>
          <a href="/map">Advanced</a>
        </nav>
      </header>

      <aside class="place-panel" aria-label="Places on the map">
        <div class="panel-heading">
          <div>
            <p class="eyebrow">Explore nearby</p>
            <h1>Find your next place</h1>
          </div>
          <button class="locate-button" id="locate" type="button" title="Use my location" aria-label="Use my location">◎</button>
        </div>

        <div class="category-filters" role="group" aria-label="Filter places by type">
          <button class="category active" type="button" data-category="all">All</button>
          <button class="category" type="button" data-category="outdoors">Outdoors</button>
          <button class="category" type="button" data-category="community">Community</button>
          <button class="category" type="button" data-category="food">Food</button>
          <button class="category" type="button" data-category="culture">Culture</button>
        </div>

        <p class="result-summary" id="result-summary" aria-live="polite">Loading places…</p>
        <div class="place-list" id="place-list" aria-live="polite"></div>
        <p class="panel-note"><span class="live-dot"></span> Places are supplied by live and public sources.</p>
      </aside>

      <div class="map-tools" aria-label="Map controls">
        <button id="reset-view" type="button" title="Show Salt Lake City" aria-label="Show Salt Lake City">⌂</button>
        <button id="zoom-in" type="button" title="Zoom in" aria-label="Zoom in">+</button>
        <button id="zoom-out" type="button" title="Zoom out" aria-label="Zoom out">−</button>
      </div>
      <div class="map-status" id="map-status" role="status">Loading street map…</div>
    </main>

    <script src="https://unpkg.com/maplibre-gl@5.2.0/dist/maplibre-gl.js"></script>
    <script src="/assets/simple-map.js" defer></script>
  </body>
</html>
