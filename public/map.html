<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0f2628" />
<title>YOUtah — Map</title>
<!--
  YOUtah map hub — one page, every feature reachable from the map.
  Served at /map: Vercel rewrites /map to this static file (vercel.json); app.py serves it locally.
  ---------------------------------------------------------------------------
  Keyless sources (no API keys needed for the demo):
    • Basemap vectors + fonts: OpenFreeMap (tiles.openfreemap.org, OSM data)
    • Elevation (hillshade, 3D terrain, smog lid, click-elevation): AWS Terrain Tiles (terrarium)
    • MapTiler terrain + contours use the browser key in CONFIG.maptilerKey (override with
      window.YOUTAH_MAPTILER_KEY). If MapTiler rejects the key, the map falls back to the keyless terrain.
  All feature data below (DATA) is DEMO data and is labelled as such in the UI.
  Hook-up: replace a layer's data at runtime with
      YOUtah.registerData('events', arrayOfItems)   // same item shape as DATA.events
  or point fetchers at the FastAPI routes (see CONFIG.api).
  Public API for the chatbot / RAG later: window.YOUtah (bottom of file).
-->
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css" />
<style>
/* ---------- Design tokens: swap these for the designer's palette ---------- */
:root{
  --spruce:#163a3a; --deep:#0f2628; --deeper:#0a1c1e;
  --glacier:#6fa8bf; --lake:#3f7f99; --moss:#7f9f6a; --sage:#a9b98f;
  --clay:#b0714b; --sandstone:#d2ad7b; --bark:#6b4f3a; --slate:#4b6470; --smog:#9a8566;
  --paper:#f3f1ea; --ink:#e7efe9; --ink-dim:#a9bdb6; --line:rgba(231,239,233,.12);
  --gold:#d9a441; --danger:#d9694a; --ok:#7fb77e; --warn:#e2b84b;
  --panel-w:380px; --detail-w:400px; --r:14px; --r-sm:9px;
  --shadow:0 10px 30px rgba(5,18,20,.35);
  --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", "PingFang SC", "Microsoft YaHei", sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--deeper);font-family:var(--font);color:var(--ink);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
#map{position:fixed;inset:0}
.maplibregl-ctrl-attrib{font-size:10px}
.maplibregl-ctrl-top-right{top:224px}
@media (max-width:899px){.maplibregl-ctrl-top-right{top:calc(272px + env(safe-area-inset-top))}.maplibregl-ctrl-bottom-right{display:none}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- glass surfaces ---------- */
.glass{background:rgba(15,38,40,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);box-shadow:var(--shadow)}
.chip{border:1px solid var(--line);background:rgba(255,255,255,.04);border-radius:999px;padding:6px 11px;font-size:13px;white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
.chip:hover{background:rgba(255,255,255,.09)}
.chip.on{background:var(--glacier);color:var(--deeper);border-color:transparent;font-weight:600}
.tag{display:inline-block;font-size:11px;padding:2px 7px;border-radius:999px;background:rgba(255,255,255,.08);color:var(--ink-dim);margin:2px 4px 0 0}
.tag.good{background:rgba(127,183,126,.18);color:#bfe3bd}.tag.warn{background:rgba(226,184,75,.18);color:#f0d68e}.tag.bad{background:rgba(217,105,74,.2);color:#f3b19d}
.tag.gold{background:rgba(217,164,65,.22);color:#f2cf86}.tag.demo{background:rgba(111,168,191,.18);color:#bfe0ec}
.btn{border:0;border-radius:10px;padding:9px 13px;background:rgba(255,255,255,.08);font-weight:600;font-size:14px}
.btn:hover{background:rgba(255,255,255,.14)}
.btn.primary{background:var(--glacier);color:var(--deeper)}
.btn.small{padding:6px 10px;font-size:12px}
.muted{color:var(--ink-dim)}
.fine{font-size:11px;color:var(--ink-dim);line-height:1.4}
h2,h3,h4{margin:0}

/* ---------- top bar ---------- */
#topbar{position:fixed;z-index:30;left:12px;top:12px;right:12px;display:flex;gap:10px;align-items:flex-start;pointer-events:none}
#topbar > *{pointer-events:auto}
#searchwrap{position:relative;z-index:2;width:calc(var(--panel-w) - 24px);flex:none}
a.btn{color:var(--ink);text-decoration:none}
#searchbox{display:flex;align-items:center;gap:8px;border-radius:999px;padding:6px 8px 6px 6px}
#brand{width:34px;height:34px;border-radius:50%;border:0;background:linear-gradient(140deg,var(--moss),var(--lake));font-weight:800;color:var(--deeper);flex:none;display:grid;place-items:center;text-decoration:none;font-size:15px}
#search{flex:1;min-width:0;background:transparent;border:0;outline:0;font-size:15px;padding:6px 2px}
#search::placeholder{color:var(--ink-dim)}
#results{position:absolute;left:0;right:0;top:52px;border-radius:var(--r);overflow:hidden;display:none;max-height:60vh;overflow-y:auto}
#results.open{display:block}
#results button{display:flex;gap:10px;width:100%;text-align:left;border:0;background:transparent;padding:10px 14px;border-bottom:1px solid var(--line)}
#results button:hover,#results button:focus{background:rgba(255,255,255,.07);outline:0}
#cities{position:relative;z-index:1;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:6px;border-radius:999px;max-width:100%}
#cities::-webkit-scrollbar{display:none}
#topright{margin-left:auto;display:flex;gap:8px;align-items:center}
#pulse{border-radius:999px;padding:7px 12px;font-size:13px;display:flex;gap:10px;align-items:center;white-space:nowrap}
#lang{border-radius:999px;padding:8px 10px;border:1px solid var(--line);background:rgba(15,38,40,.92)}
#lang option{background:var(--deep)}

/* ---------- floating action buttons ---------- */
#fabs{position:fixed;z-index:25;right:12px;top:70px;display:flex;flex-direction:column;gap:8px}
.fab{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:rgba(15,38,40,.92);font-weight:700;font-size:14px;display:grid;place-items:center;box-shadow:var(--shadow)}
.fab.on{background:var(--glacier);color:var(--deeper)}

/* ---------- panel (left sidebar desktop / bottom sheet mobile) ---------- */
.sheet{position:fixed;z-index:20;display:flex;flex-direction:column;border-radius:var(--r);overflow:hidden}
#panel{left:12px;top:70px;bottom:12px;width:calc(var(--panel-w) - 24px)}
#detail{right:12px;top:70px;bottom:12px;width:var(--detail-w);transform:translateX(calc(100% + 24px));transition:transform .25s ease;z-index:22}
#detail.open{transform:none}
.sheet-head{flex:none;padding:10px 12px 0;touch-action:none}
.handle{display:none;width:44px;height:5px;border-radius:9px;background:rgba(255,255,255,.28);margin:2px auto 10px;border:0;padding:0}
.sheet-body{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:10px 14px 18px;-webkit-overflow-scrolling:touch}
#timebar{display:flex;flex-direction:column;gap:6px;padding:4px 2px 10px;border-bottom:1px solid var(--line)}
#timebar .row{display:flex;gap:6px;align-items:center;overflow-x:auto;scrollbar-width:none}
#timebar input[type=range]{width:100%;accent-color:var(--glacier)}
#timeLabel{font-size:12px;color:var(--ink-dim);display:flex;justify-content:space-between}
#tabs{display:flex;gap:4px;padding:8px 0 0}
#tabs button{flex:1;border:0;background:transparent;padding:9px 4px;border-bottom:2px solid transparent;color:var(--ink-dim);font-weight:600}
#tabs button.on{color:var(--ink);border-color:var(--glacier)}
.tab{display:none}.tab.on{display:block}
.section-title{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-dim);margin:16px 0 8px}
.row-wrap{display:flex;flex-wrap:wrap;gap:6px}
.toggle-row{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:8px 0}
.switch{position:relative;width:38px;height:22px;flex:none}
.switch input{opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;border-radius:99px;background:rgba(255,255,255,.18);transition:.2s}
.switch span:before{content:"";position:absolute;width:16px;height:16px;left:3px;top:3px;border-radius:50%;background:#fff;transition:.2s}
.switch input:checked + span{background:var(--moss)}
.switch input:checked + span:before{transform:translateX(16px)}

/* feed cards */
.card{border:1px solid var(--line);border-radius:var(--r);padding:12px;margin:0 0 10px;background:rgba(255,255,255,.03);text-align:left;width:100%;display:block}
button.card:hover{background:rgba(255,255,255,.07)}
.card .top{display:flex;gap:10px;align-items:flex-start}
.emoji{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-size:19px;flex:none}
.card h4{font-size:15px;line-height:1.25}
.card .meta{font-size:12px;color:var(--ink-dim);margin-top:3px}
.card.sponsored{border-color:rgba(217,164,65,.55)}
.card.dim{opacity:.45}
.score{margin-left:auto;font-size:11px;color:var(--ink-dim);text-align:right;flex:none}

/* layer list */
details.cat{border-top:1px solid var(--line);padding:4px 0}
details.cat summary{list-style:none;display:flex;align-items:center;gap:8px;padding:10px 0;font-weight:700;cursor:pointer}
details.cat summary::-webkit-details-marker{display:none}
details.cat summary .count{margin-left:auto;font-size:12px;color:var(--ink-dim);font-weight:500}
.layer{display:flex;align-items:center;gap:10px;padding:7px 0 7px 4px}
.layer .sw{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:14px;flex:none}
.layer .nm{flex:1;min-width:0;font-size:14px}
.layer .nm small{display:block;color:var(--ink-dim);font-size:11px}
.layer.persona-hit .nm{color:#d9efe0}
.layer.persona-hit .sw{outline:2px solid var(--glacier);outline-offset:1px}
select.ctl{width:100%;padding:9px 10px;border-radius:10px;background:rgba(255,255,255,.06);border:1px solid var(--line)}
select.ctl option{background:var(--deep)}
.legend{display:flex;height:10px;border-radius:6px;overflow:hidden;margin-top:8px}
.legend-l{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-dim);margin-top:3px}

/* detail */
#detailBody .hero{display:flex;gap:12px;align-items:flex-start;margin-bottom:8px}
#detailBody .hero .emoji{width:48px;height:48px;font-size:26px;border-radius:14px}
#detailBody h2{font-size:20px;line-height:1.2}
.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:13px;margin:10px 0}
.facts dt{color:var(--ink-dim)}.facts dd{margin:0}
.box{border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;margin:10px 0;background:rgba(255,255,255,.03)}
.box h4{font-size:13px;margin-bottom:6px;display:flex;gap:6px;align-items:center}
.go-row{display:flex;gap:10px;font-size:13px;padding:5px 0;border-top:1px solid var(--line)}
.go-row:first-of-type{border-top:0}
.go-row b{min-width:22px}
.actions{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.ml-chip{display:flex;align-items:center;gap:10px}
.ml-chip .pct{font-size:22px;font-weight:800}
.spark{display:flex;align-items:flex-end;gap:2px;height:34px;margin-top:6px}
.spark i{flex:1;background:var(--slate);border-radius:2px 2px 0 0;min-height:2px}
.spark i.now{background:var(--glacier)}
.close{position:absolute;right:10px;top:10px;width:34px;height:34px;border-radius:50%;border:0;background:rgba(255,255,255,.08);z-index:2}

/* inversion card */
#inv{position:fixed;z-index:19;right:12px;bottom:40px;width:340px;border-radius:var(--r);transition:right .25s ease}
body.detail-open #inv{right:calc(var(--detail-w) + 24px)}
#invPill{width:100%;display:flex;align-items:center;gap:8px;border:0;background:transparent;padding:11px 14px;font-weight:700;text-align:left}
#invPill .caret{margin-left:auto;transition:transform .2s}
#inv.collapsed #invPill .caret{transform:rotate(180deg)}
#invBody{padding:0 14px 12px;max-height:48vh;overflow:auto}
#inv.collapsed #invBody{display:none}
.escape{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);width:100%;border-left:0;border-right:0;border-bottom:0;background:transparent;text-align:left}
.escape .el{margin-left:auto;text-align:right;font-size:12px;color:var(--ink-dim)}
.profile svg{width:100%;height:auto;display:block}

/* status bar */
#status{position:fixed;z-index:18;left:var(--panel-w);bottom:12px;border-radius:999px;padding:6px 12px;font-size:12px;display:flex;gap:10px;align-items:center;max-width:calc(100vw - var(--panel-w) - 380px)}
#status:empty{display:none}

/* map popups */
.maplibregl-popup-content{background:var(--deep);color:var(--ink);border-radius:10px;padding:8px 11px;box-shadow:var(--shadow);font-size:13px}
.maplibregl-popup-tip{border-top-color:var(--deep)!important;border-bottom-color:var(--deep)!important}
.pick-banner{position:fixed;z-index:40;left:50%;top:70px;transform:translateX(-50%);border-radius:999px;padding:10px 16px;font-weight:600}

/* modal + toast */
#modal{position:fixed;inset:0;z-index:60;background:rgba(5,15,16,.55);display:grid;place-items:center;padding:16px}
#modal[hidden]{display:none}
#modal .m{width:min(440px,100%);border-radius:var(--r);padding:18px;max-height:90dvh;overflow:auto}
#modal label{display:block;font-size:13px;margin:10px 0 4px;color:var(--ink-dim)}
#modal input,#modal textarea,#modal select{width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.06)}
.tier{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0;width:100%;background:transparent;text-align:left}
.tier.on{border-color:var(--gold);background:rgba(217,164,65,.1)}
#toast{position:fixed;z-index:70;left:50%;bottom:24px;transform:translate(-50%,40px);opacity:0;transition:.25s;border-radius:999px;padding:10px 16px;font-size:14px;pointer-events:none;max-width:90vw}
#toast.show{transform:translate(-50%,0);opacity:1}
#maperr{position:fixed;inset:auto 0 50% 0;text-align:center;z-index:5;color:var(--ink-dim);display:none}

/* ---------- mobile (essential) ---------- */
@media (max-width: 899px){
  #topbar{left:8px;right:8px;top:calc(8px + env(safe-area-inset-top));flex-direction:column;gap:6px}
  #searchwrap{width:100%}
  #cities{width:100%;border-radius:999px}
  #topright{display:none}
  #fabs{right:8px;top:calc(118px + env(safe-area-inset-top))}
  .fab{width:42px;height:42px}
  .sheet{left:0!important;right:0!important;width:auto!important;top:0!important;bottom:auto!important;height:94dvh;border-radius:18px 18px 0 0;transition:transform .25s ease;will-change:transform}
  #detail{z-index:24;transform:translateY(100dvh)}
  #detail.open{transform:translateY(50dvh)}
  .handle{display:block}
  .sheet-body{max-height:calc(var(--vis, 50dvh) - var(--head, 150px));padding-bottom:calc(18px + env(safe-area-inset-bottom))}
  #inv{left:8px;right:auto;top:calc(118px + env(safe-area-inset-top));bottom:auto;width:min(340px, calc(100vw - 70px))}
  body.detail-open #inv{right:auto}
  #invBody{max-height:46dvh}
  #status{left:8px;right:auto;bottom:auto;top:calc(168px + env(safe-area-inset-top));max-width:calc(100vw - 70px)}
  #status.hidden-m{display:none}
  .pick-banner{top:auto;bottom:180px}
  #toast{bottom:170px}
  .chip{padding:7px 12px}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="map" role="application" aria-label="Topographic map of Utah"></div>
<div id="maperr">Map tiles could not load — the panels still work with demo data.</div>

<header id="topbar">
  <div id="searchwrap">
    <div id="searchbox" class="glass">
      <a id="brand" href="/" title="YOUtah home" aria-label="YOUtah home">YU</a>
      <input id="search" type="search" autocomplete="off" data-i18n-ph="search" placeholder="Search Utah: places, events, trails…" aria-label="Search" />
    </div>
    <div id="results" class="glass" role="listbox"></div>
  </div>
  <nav id="cities" class="glass" aria-label="Jump to city"></nav>
  <div id="topright">
    <div id="pulse" class="glass" aria-live="polite"></div>
    <select id="lang" aria-label="Language">
      <option value="en">English</option><option value="es">Español</option><option value="zh">中文</option>
    </select>
  </div>
</header>

<div id="fabs">
  <button class="fab" id="fab3d" title="Toggle 2D / 3D terrain" aria-label="Toggle 3D terrain">3D</button>
  <button class="fab" id="fabLocate" title="My location" aria-label="My location">◎</button>
  <button class="fab" id="fabSuggest" title="Suggest a spot" aria-label="Suggest a spot" data-i18n-title="suggest">＋</button>
</div>

<aside id="panel" class="sheet glass" aria-label="Explore">
  <div class="sheet-head">
    <button class="handle" aria-label="Resize panel"></button>
    <div id="timebar">
      <div class="row" id="timeChips"></div>
      <input id="timeRange" type="range" min="0" max="72" step="1" value="0" aria-label="Time" />
      <div id="timeLabel"><span id="timeText">Now</span><span class="fine" id="timeHint">drag to see later</span></div>
    </div>
    <div id="tabs" role="tablist">
      <button class="on" data-tab="today" data-i18n="today">Today</button>
      <button data-tab="layers" data-i18n="layers">Layers</button>
      <button data-tab="plan" data-i18n="plan">Plan</button>
    </div>
  </div>
  <div class="sheet-body">
    <section class="tab on" id="tab-today"></section>
    <section class="tab" id="tab-layers"></section>
    <section class="tab" id="tab-plan"></section>
  </div>
</aside>

<aside id="detail" class="sheet glass" aria-label="Details">
  <div class="sheet-head"><button class="handle" aria-label="Resize details"></button></div>
  <button class="close" id="detailClose" aria-label="Close">✕</button>
  <div class="sheet-body" id="detailBody"></div>
</aside>

<section id="inv" class="glass" aria-label="Escape the inversion">
  <button id="invPill"><span>🌫</span><span id="invPillText">Escape the inversion</span><span class="caret">▾</span></button>
  <div id="invBody"></div>
</section>

<div id="status" class="glass" aria-live="polite"></div>
<div id="modal" hidden><div class="m glass" id="modalBox"></div></div>
<div id="toast" class="glass" role="status"></div>

<script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
<script>
'use strict';
/* =========================================================================
   0. Utilities
   ========================================================================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const mqMobile = matchMedia('(max-width: 899px)');
const isMobile = () => mqMobile.matches;
const canHover = matchMedia('(hover: hover)').matches;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = {
  get(k, d) { try { const v = localStorage.getItem('youtah:' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('youtah:' + k, JSON.stringify(v)); } catch {} }
};
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
function km(a, b) {
  const R = 6371, toR = Math.PI / 180;
  const dLat = (b.lat - a.lat) * toR, dLng = (b.lng - a.lng) * toR;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * toR) * Math.cos(b.lat * toR) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
const mi = k => k * 0.621371;
const ft = m => Math.round(m * 3.28084);
const fmtDist = k => k < 1 ? `${Math.round(k * 1000)} m` : `${k < 10 ? k.toFixed(1) : Math.round(k)} km`;
const money = v => v === 0 ? 'Free' : v == null ? '—' : `$${v % 1 ? v.toFixed(2) : v}`;
function hash01(s) { let h = 2166136261; for (const c of String(s)) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return ((h >>> 0) % 1000) / 1000; }
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2600); }

/* =========================================================================
   1. Config, palette, i18n
   ========================================================================= */
const CONFIG = {
  utahBounds: { minLat: 36.99, maxLat: 42.01, minLng: -114.06, maxLng: -109.04 },
  defaultOrigin: { lat: 40.7608, lng: -111.8910, label: 'Salt Lake City' },
  // Browser-side MapTiler key (restrict allowed origins in the MapTiler dashboard). Falls back to keyless sources on error.
  maptilerKey: window.YOUTAH_MAPTILER_KEY || 'ZVzYn0DX2lp5DAYTDqOu',
  // For Claude Code: live endpoints to swap in for demo data (see registerData)
  api: { dashboard: '/api/dashboard', inversion: '/api/recommendations/escape-inversion' }
};

/* =========================================================================
   2. Time helpers (everything is relative to page-load time so the demo always looks live)
   ========================================================================= */
const NOW = new Date();
function dayAt(h, m = 0, d = 0) { const x = new Date(NOW); x.setDate(x.getDate() + d); x.setHours(h, m, 0, 0); return x; }
const SAT = (6 - NOW.getDay() + 7) % 7;               // days until Saturday (0 if today)
const SUN = SAT === 0 && NOW.getDay() === 0 ? 0 : SAT + 1;
const ev = (sh, sm, d, durH) => { const s = dayAt(sh, sm, d); return { start: s, end: new Date(s.getTime() + durH * 3600e3) }; };
function fmtTime(d) { return d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }); }
function fmtDay(d) {
  const a = new Date(NOW); a.setHours(0,0,0,0); const b = new Date(d); b.setHours(0,0,0,0);
  const diff = Math.round((b - a) / 864e5);
  return diff === 0 ? t('today') : diff === 1 ? t('tomorrow') : d.toLocaleDateString([], { weekday: 'long' });
}

/* Smog-cap estimate. Real version: Utah DAQ ceilometer mixing height + where mountain-station
   temperatures flip from cooling to warming with height. Demo: diurnal curve around 1,600 m. */
function capHeight(T = tAt()) {
  if (state.capOverride) return state.capOverride;
  const h = T.getHours() + T.getMinutes() / 60, days = (T - NOW) / 864e5;
  return Math.round(1600 + 140 * Math.sin((h - 9) / 24 * 2 * Math.PI) - 25 * days);
}
function valleyAQI(T = tAt()) {
  if (state.aqiOverride != null) return state.aqiOverride; // live inversion hook
  const h = T.getHours(), days = (T - NOW) / 864e5;
  return Math.max(20, Math.round(124 + 12 * Math.sin((h - 6) / 24 * 2 * Math.PI) + 6 * days));
}
function aqiInfo(a) {

}
function escapes(T = tAt(), n = 3) {
  const cap = capHeight(T);

    .map(x => ({ x, d: km(state.origin, x), road: DATA.roads.find(r => r.canyon && r.canyon === x.canyon) }))
    .sort((a, b) => a.d - b.d).slice(0, n);
}

  trailheads:[0,0,0,0,0,0,.1,.3,.6,.9,1,.9,.8,.7,.6,.5,.4,.2,.1,0,0,0,0,0],
  ski:[0,0,0,0,0,0,0,.2,.8,1,.9,.8,.6,.7,.6,.4,.1,0,0,0,0,0,0,0],
  libraries:[0,0,0,0,0,0,0,0,0,.2,.4,.5,.5,.6,.7,.8,.8,.6,.4,.2,0,0,0,0],
  uni:[0,0,0,0,0,0,0,.2,.6,.9,1,1,.9,.9,.8,.6,.4,.3,.3,.2,.1,0,0,0],

  default:[0,0,0,0,0,0,.1,.2,.3,.4,.6,.7,.7,.7,.7,.7,.7,.7,.6,.5,.4,.2,.1,0]

function busy(it, T = tAt()) {
  if (it.layer === 'events') {
    if (T < new Date(it.start.getTime() - 3600e3) || T > it.end) return 0;
    return Math.min(1, (it.pop || .5) * (T < it.start ? .5 : 1.05));
  }
  const prof = PROFILES[it.layer] || PROFILES.default;
  const weekend = [0, 6].includes(T.getDay()) ? 1.15 : 1;
  let v = prof[T.getHours()] * (it.pop ?? .45) * weekend * (0.85 + 0.3 * hash01(it.gid));
  if (it.layer === 'trailheads' && it.basin && it.elev > capHeight(T)) v *= 1.25; // inversion escape demand
  return Math.max(0, Math.min(1, v));
}
function bestHour(it) {
  const T = tAt(); let best = null;
  for (let h = 8; h <= 20; h++) { const x = new Date(T); x.setHours(h, 0, 0, 0); const b = busy(it, x); if (best == null || b < best.b) best = { h, b }; }
  return best;
}

/* "What's most interesting right now" ranking (hand-tuned weights; ML score mixes in) */
function feed() {
  const T = tAt(), out = [], cap = capHeight(T), aqi = valleyAQI(T);
  const push = (it, score, reasons, when) => {
    if (state.offBrochure && it.brochure) return;
    if (state.persona && (it.personas || LBYID[it.layer]?.personas || []).includes(state.persona)) { score += 14; reasons.push(t(state.persona)); }
    if (it.sponsored) { score += 6; }
    const d = km(state.origin, it); score -= Math.min(18, d / 6);
    if (state.offBrochure && !it.brochure) score += 4;
    out.push({ it, score, reasons, when, d, over: state.fitBudget && (it.price || 0) > remainingBudget() });
  };
  for (const e of DATA.events) {
    if (e.end < T) continue;
    const hrs = (e.start - T) / 3600e3; if (hrs > 36) continue;
    const r = [], live = hrs <= 0;
    let s = 45 * (e.pop || .5) + (live ? 26 : hrs < 3 ? 20 : hrs < 8 ? 11 : 3);
    if (live) r.push('Happening now'); else if (hrs < 3) { const m = Math.max(5, Math.round(hrs * 60 / 5) * 5); r.push(m < 60 ? `Starts in ${m} min` : `Starts in ${hrs.toFixed(1)} h`); }
    if (e.price === 0) { s += 6; r.push('Free'); }
    push(e, s, r, `${fmtDay(e.start)} ${fmtTime(e.start)} · ${e.venue}`);
  }
  if (aqi > 100) for (const { x, road } of escapes(T, 3)) {
    const r = ['Above the smog', `+${x.elev - cap} m`]; if (x.bus) r.push(`Bus ${x.bus}`);
    push(x, 52 + (x.pop || .5) * 10, r, [thBits(x), road ? road.status : 'road open'].filter(Boolean).join(' · '));
  }
  for (const s of DATA.ski) if (s.snow24 >= 4) push(s, 30 + s.snow24 * 3, [`${s.snow24}" new snow`, `${s.wait} min lift wait`], `${s.lifts}/${s.liftsTotal} lifts · ${money(s.price)}`);
  for (const f of DATA.food) if ((f.buzz || 0) > 35) { const b = busy(f, T); push(f, 22 + f.buzz / 8, ['Trending', b > .7 ? 'Busy now' : 'Short wait'], `${f.cuisine} · ★ ${f.rating}`); }
  const lore = DATA.lore[Math.floor(hash01(NOW.toDateString()) * DATA.lore.length)];
  push(lore, 34, ['Local secret'], 'Today\'s piece of Utah lore');
  for (const c of DATA.community.slice(0, 2)) push(c, 24, ['From locals'], c.by || 'Community');
  const o = DATA.outages.find(x => x.state === 'Active'); if (o) push(o, state.persona === 'remote' ? 50 : 18, ['Internet outage'], o.provider);
  return out.sort((a, b) => b.score - a.score).slice(0, 14);
}

function nearestTransit(p) {
  let best = null;
  for (const l of DATA.transit) for (const c of l.coords) { const d = km(p, { lat: c[1], lng: c[0] }); if (!best || d < best.d) best = { d, l }; }
  return best;
}
function getThere(it) {
  const d = km(state.origin, it), m = mi(d), tr = nearestTransit(it);
  const driveMin = Math.round(d / (d < 15 ? 38 : 85) * 60 + 4);
  const fare = 2.6 + 1.25 * m + 0.3 * driveMin;
  const park = DATA.parking.map(p => ({ p, d: km(p, it) })).sort((a, b) => a.d - b.d)[0];
  const rows = [];
  if (it.bus) rows.push(['🚌', `UTA ski bus ${it.bus} stops at the trailhead · from 6200 S Park & Ride`]);
  else if (tr && tr.d < 1.2) rows.push(['🚆', `${tr.l.name} · ${Math.max(1, Math.round(tr.d * 1000 / 80))} min walk from the line · every ${tr.l.freq} min`]);
  else rows.push(['🚌', 'No rail nearby — check UTA bus routes']);
  rows.push(['🚗', `${driveMin} min drive (${fmtDist(d)})${park && park.d < 1.5 ? ` · park at ${park.p.name} (${money(park.p.price)})` : ''}`]);
  rows.push(['🚕', `Rideshare ≈ $${Math.round(fare * 0.85)}–${Math.round(fare * 1.2)} (estimate)`]);
  if (d < 3.5) rows.push(['🚶', `${Math.round(d / 4.8 * 60)} min walk`]);
  return { rows, cost: tr && tr.d < 1.2 ? 2.5 : it.bus ? 2.5 : Math.round(d * 0.12 * 2), d };
}

function gridAddr(lat, lng) {

  const ns = (lat - g.lat0) * 111320 / UNIT_M, ew = (lng - g.lng0) * 111320 * Math.cos(g.lat0 * Math.PI / 180) / UNIT_M;

  return { g, text: `${f(ns, 'N', 'S')} · ${f(ew, 'E', 'W')}` };

/* Elevation at a point: decode a terrarium tile pixel (works in 2D and 3D, tiny cache) */
const elevCache = new Map();
async function elevationAt(lng, lat) {
  const z = 12, n = 2 ** z, latR = lat * Math.PI / 180;
  const xt = (lng + 180) / 360 * n, yt = (1 - Math.log(Math.tan(latR) + 1 / Math.cos(latR)) / Math.PI) / 2 * n;
  const x = Math.floor(xt), y = Math.floor(yt), key = `${x}/${y}`;
  let ctx = elevCache.get(key);
  if (!ctx) {
    const img = new Image(); img.crossOrigin = 'anonymous';
    img.src = `https://s3.amazonaws.com/elevation-tiles-prod/terrarium/${z}/${x}/${y}.png`;
    await img.decode();
    const c = document.createElement('canvas'); c.width = c.height = 256; ctx = c.getContext('2d', { willReadFrequently: true });
    ctx.drawImage(img, 0, 0);
    elevCache.set(key, ctx); if (elevCache.size > 6) elevCache.delete(elevCache.keys().next().value);
  }
  const [r, g, b] = ctx.getImageData(Math.floor((xt - x) * 256), Math.floor((yt - y) * 256), 1, 1).data;
  return Math.round(r * 256 + g + b / 256 - 32768);
}

  if (on && !added.has(id)) {

    if (L.kind === 'point') addPointLayer(L); else if (L.kind === 'line') addLineLayer(L); else if (L.kind === 'fill') addFillLayer(L); else if (L.kind === 'heat') addHeatLayer();
  }

}

/* interaction helpers */
const INTERACTIVE = () => LAYERS.flatMap(L => L.kind === 'point' ? [L.id + '-pt'] : L.kind === 'line' ? [L.id + '-hit'] : L.kind === 'fill' ? [L.id + '-fill'] : []).filter(id => map.getLayer(id));
function hitInteractive(pt) { return map.queryRenderedFeatures(pt, { layers: INTERACTIVE() }).length > 0; }
function hoverCursor(id) { map.on('mouseenter', id, () => map.getCanvas().style.cursor = 'pointer'); map.on('mouseleave', id, () => map.getCanvas().style.cursor = ''); }
let hoverPop = null;
const wired = new Set();
function wireInteraction(id) {
  if (wired.has(id)) return; wired.add(id);
  hoverCursor(id);
  map.on('click', id, e => {
    if (state.pickMode) return;
    if (id.endsWith('-fill') && map.queryRenderedFeatures(e.point, { layers: INTERACTIVE().filter(x => !x.endsWith('-fill')) }).length) return; // let points win over polygons
    select(e.features[0].properties.gid, { fly: false });
  });
  if (canHover) {
    map.on('mousemove', id, e => {
      const it = BYID[e.features[0].properties.gid]; if (!it) return;
      hoverPop = hoverPop || new maplibregl.Popup({ closeButton:false, closeOnClick:false, offset:14, maxWidth:'260px' });
      hoverPop.setLngLat(e.lngLat).setHTML(`<b>${esc(it.name)}</b><br><span style="opacity:.75">${esc(oneLiner(it))}</span>`).addTo(map);
    });
    map.on('mouseleave', id, () => hoverPop && hoverPop.remove());
  }
}

    // MapTiler key rejected (e.g. origin restriction on file:// or localhost) → rebuild style with keyless terrain

  map.on('style.load', () => {
    mapReady = true; added.clear();
    for (const L of LAYERS) applyLayer(L.id);

    updatePadding(); updateGrid();
    if (state.context !== 'none') setContext(state.context);
    drawPlanRoute(); if (state.selected) setSelection(BYID[state.selected]);
  });
  map.on('moveend', debounce(() => { updateGrid(); if (isMobile()) statusFor(map.getCenter()); }, 120));
  map.on('mousemove', debounce(e => { if (!isMobile()) statusFor(e.lngLat); }, 60));
  map.on('click', async e => {
    if (state.pickMode) return finishPick(e.lngLat);
    if (hitInteractive(e.point)) return;

}

    case 'trailheads': return [it.verdict, `${it.elev.toLocaleString()} m`, thBits(it)].filter(Boolean).join(' · ');
    case 'ski': return `${it.snow24}" new · ${it.lifts}/${it.liftsTotal} lifts · ~${it.wait} min wait`;
    case 'aq': { const a = it.live ? it.aqi : Math.round(it.aqi * valleyAQI() / 124); return `AQI ${a} · ${aqiInfo(a)[0]}${it.live ? ` · PM2.5 ${it.pm}` : ''}`; }
    case 'wx': return `${it.temp}°C at ${it.elev.toLocaleString()} m · ${it.cond}`;
    case 'food': return `${it.cuisine} · ★ ${it.rating} · ~${money(it.price)}`;

    case 'parking': return `${money(it.price)} · ${it.spaces}`;

}

/* =========================================================================
   9. Mobile bottom sheets
   ========================================================================= */
function makeSheet(el, { peek = 168, closable = false } = {}) {
  const head = el.querySelector('.sheet-head');
  const snaps = () => { const H = innerHeight; return { full: H * .06, half: H * .48, peek: H - peek, hidden: H + 20 }; };
  let snap = closable ? 'hidden' : 'peek';
  function apply() {
    if (!isMobile()) { el.style.transform = ''; el._y = undefined; return; }
    const y = snaps()[snap]; el._y = y; el.style.transform = `translateY(${y}px)`;
    el.style.setProperty('--vis', `${innerHeight - y}px`); el.style.setProperty('--head', `${head.offsetHeight}px`);
    updatePadding();
  }
  let sy = 0, st = 0, drag = false, moved = false;
  head.addEventListener('pointerdown', e => { if (!isMobile() || e.target.closest('input,select')) return; drag = true; moved = false; sy = e.clientY; st = snaps()[snap]; });
  head.addEventListener('pointermove', e => {
    if (!drag) return; const dy = e.clientY - sy;
    if (!moved && Math.abs(dy) > 7) { moved = true; el.style.transition = 'none'; try { head.setPointerCapture(e.pointerId); } catch {} }
    if (moved) el.style.transform = `translateY(${Math.max(snaps().full, st + dy)}px)`;
  });
  const end = e => {
    if (!drag) return; drag = false; el.style.transition = '';
    if (moved) {
      const y = st + (e.clientY - sy), s = snaps(), keys = closable ? ['full', 'half', 'peek', 'hidden'] : ['full', 'half', 'peek'];
      snap = keys.sort((a, b) => Math.abs(s[a] - y) - Math.abs(s[b] - y))[0];
      if (snap === 'hidden') { closeDetail(); return; }
    }
    apply();
  };
  head.addEventListener('pointerup', end); head.addEventListener('pointercancel', end);
  el.querySelector('.handle').addEventListener('click', () => { if (!moved) { snap = snap === 'peek' ? 'half' : snap === 'half' ? 'full' : 'peek'; apply(); } });
  return { set(s) { snap = s; apply(); }, hide() { snap = 'hidden'; apply(); }, apply, get snap() { return snap; } };
}

  // inversion card
  $('#invPill').onclick = () => $('#inv').classList.toggle('collapsed');
  $('#invBody').addEventListener('click', e => { const g = e.target.closest('[data-gid]'); if (g) { if (isMobile()) $('#inv').classList.add('collapsed'); select(g.dataset.gid); } });
  $('#invBody').addEventListener('change', e => { if (e.target.id === 'lidToggle') setLayer('inversion', e.target.checked); });
  // fabs
  $('#fab3d').onclick = () => { set3D(!state.three); renderLayers(); };
  $('#fabLocate').onclick = () => locate(true);
  $('#fabSuggest').onclick = startPick;
  // language
  $('#lang').value = state.lang;
  $('#lang').onchange = e => { state.lang = e.target.value; store.set('lang', state.lang); renderAll(); };
  // modal
  $('#modal').addEventListener('click', e => { if (e.target.id === 'modal' || e.target.closest('[data-close]')) closeModal(); });
  addEventListener('keydown', e => { if (e.key === 'Escape') { closeModal(); if (state.pickMode) endPick(); else if (state.selected) closeDetail(); } });
  // search
  const doSearch = debounce(() => {
    const q = $('#search').value.trim().toLowerCase(), box = $('#results');
    if (q.length < 2) { box.classList.remove('open'); return; }
    const cities = CITIES.map((c, i) => ({ c, i })).filter(({ c }) => c[0].toLowerCase().includes(q)).slice(0, 3);
    const hits = Object.values(BYID).map(it => {
      const hay = `${it.name} ${it.d || ''} ${it.cuisine || ''} ${it.venue || ''} ${it.cat || ''} ${LBYID[it.layer]?.name || ''}`.toLowerCase();
      const s = it.name.toLowerCase().startsWith(q) ? 3 : it.name.toLowerCase().includes(q) ? 2 : hay.includes(q) ? 1 : 0;
      return { it, s };
    }).filter(x => x.s).sort((a, b) => b.s - a.s).slice(0, 8);
    box.innerHTML = cities.map(({ c, i }) => `<button data-city-r="${i}">🏙 <span><b>${esc(c[0])}</b><br><span class="fine">City</span></span></button>`).join('')
      + hits.map(({ it }) => `<button data-gid="${it.gid}">${LBYID[it.layer].emoji} <span><b>${esc(it.name)}</b><br><span class="fine">${esc(LBYID[it.layer].name)} · ${esc(oneLiner(it))}</span></span></button>`).join('')
      + `<button data-ask>💬 <span><b>Ask Utah: “${esc(q)}”</b><br><span class="fine">AI guide with web search — coming soon</span></span></button>`;
    box.classList.add('open');
  }, 120);
  $('#search').addEventListener('input', doSearch);
  $('#search').addEventListener('keydown', e => { if (e.key === 'Enter') $('#results button')?.click(); });
  $('#results').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.gid) select(b.dataset.gid);
    else if (b.dataset.cityR) $(`#cities [data-city="${b.dataset.cityR}"]`).click();
    else if ('ask' in b.dataset) toast('Ask Utah (AI + web search) is coming soon');
    $('#results').classList.remove('open'); $('#search').blur();
  });
  document.addEventListener('click', e => { if (!e.target.closest('#searchwrap')) $('#results').classList.remove('open'); });
  // responsive
  mqMobile.addEventListener('change', () => { panelSheet.apply(); state.selected ? detailSheet.set('half') : detailSheet.apply(); updatePadding(); $('#inv').classList.toggle('collapsed', isMobile()); });
  addEventListener('resize', debounce(() => { panelSheet.apply(); if (state.selected) detailSheet.apply(); map && map.resize(); }, 150));
}
function savePlan() { store.set('plan', state.plan); renderPlan(); renderToday(); drawPlanRoute(); if (state.selected) renderDetail(BYID[state.selected]); }
function refreshBrochure() {
  if (!mapReady) return;
  for (const L of LAYERS) if (L.kind === 'point' && map.getLayer(L.id + '-pt')) { map.setPaintProperty(L.id + '-pt', 'icon-opacity', brochureOpacity()); map.setPaintProperty(L.id + '-pt', 'text-opacity', brochureOpacity()); }
}

/* geolocation: center on user if inside Utah, else Salt Lake City */
function locate(explicit) {
  if (!navigator.geolocation) { if (explicit) toast('Location not available'); return; }
  navigator.geolocation.getCurrentPosition(pos => {
    const { latitude: lat, longitude: lng } = pos.coords, B = CONFIG.utahBounds;
    const inUtah = lat > B.minLat && lat < B.maxLat && lng > B.minLng && lng < B.maxLng;
    if (inUtah) { state.origin = { lat, lng, label: 'your location' }; if (mapReady) map.flyTo({ center: [lng, lat], zoom: 12.5 }); renderToday(); renderInversion(); }
    else if (explicit) toast('You\'re outside Utah — showing Salt Lake City');
  }, () => explicit && toast('Location permission denied — showing Salt Lake City'), { enableHighAccuracy: false, timeout: 8000, maximumAge: 600000 });
}

/* =========================================================================
   12. Boot
   ========================================================================= */
(function boot() {
  for (const m of store.get('mine', [])) DATA.community.push(P(m.id, m.name, m.lat, m.lng, { d: m.d, by: '@you', src: 'community' }));
  indexData();
  panelSheet = makeSheet($('#panel'), { peek: 172 });
  detailSheet = makeSheet($('#detail'), { closable: true });
  wire(); renderAll();
  set3D(state.three, false);
  if (isMobile()) $('#inv').classList.add('collapsed');
  panelSheet.apply();
  initMap();
  locate(false);
  const h = decodeURIComponent(location.hash.slice(1)); if (BYID[h]) setTimeout(() => select(h), 600);
})();

/* =========================================================================
   13. Public API — for Claude Code hook-up and the future chatbot / RAG navigator
   ========================================================================= */
window.YOUtah = {
  get map() { return map; }, state, DATA, LAYERS, SOURCES,
  /** Replace a layer's items (same shape as DATA[layer]) — e.g. from /api/dashboard */
  registerData(layer, items) {
    DATA[layer] = items.map(x => ({ ...x, start: x.start ? new Date(x.start) : undefined, end: x.end ? new Date(x.end) : undefined }));
    indexData(); if (mapReady && map.getSource('src-' + layer)) map.getSource('src-' + layer).setData(fc(layer));
    if (layer === 'trailheads' || layer === 'aq' || layer === 'wx') HEX = null;
    renderAll();
  },
  setCapHeight(m) { state.capOverride = m; onTime(); },   // feed real DAQ/ceilometer estimate here
  setValleyAQI(a) { state.aqiOverride = a; onTime(); },   // live inversion hook
  setInversionLive(info) { state.invLive = info; renderAll(); },   // live inversion hook
  select, setLayer, setContext, set3D,
  setPersona(p) { state.persona = PERSONAS.includes(p) ? p : null; renderToday(); renderLayers(); },
  setTime(hoursFromNow) { state.t = Math.max(0, Math.min(72, hoursFromNow)); $('#timeRange').value = state.t; onTime(); },
  flyToCity(name) { const i = CITIES.findIndex(c => c[0].toLowerCase().includes(String(name).toLowerCase())); if (i >= 0) $(`#cities [data-city="${i}"]`).click(); },
  addToPlan(gid) { if (BYID[gid] && !state.plan.includes(gid)) { state.plan.push(gid); savePlan(); } },
  search(q) { q = q.toLowerCase(); return Object.values(BYID).filter(it => `${it.name} ${it.d || ''}`.toLowerCase().includes(q)).map(it => ({ gid: it.gid, name: it.name, layer: it.layer })); },
  feed: () => feed().map(x => ({ gid: x.it.gid, name: x.it.name, reasons: x.reasons, score: Math.round(x.score) }))
};
</script>
<script src="/assets/map-live-inversion.js" defer></script>
